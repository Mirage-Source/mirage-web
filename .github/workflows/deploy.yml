name: Deploy mirage-web
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck + build (fail fast before touching the VPS)
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd /opt/mirage/mirage-web
            git fetch origin master
            git reset --hard origin/master
            # mirage-core must already be up: its compose file owns the
            # mirage_net network this joins as external (see
            # docker-compose.yml here).
            docker compose up --build -d
            docker compose ps
